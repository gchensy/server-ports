[package]
name = "server-ports"
version = "0.1.0"
description = "Map remote server ports to your local machine over SSH"
authors = ["chensy"]
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "server_ports_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.12 or newer: it brings tao 0.36+, whose window frame reacts to clicks on Wayland (the title bar
# buttons of tao 0.35 were dead on GNOME). It needs Rust 1.90, hence `rust-version` above.
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", default-features = false }
# `ring` instead of the default aws-lc-rs: it builds on all three OSes in CI without cmake/NASM.
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
keyring = "4"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
# Only for an in-process ssh-agent in the engine tests; russh already depends on it.
futures = "0.3"

# Full debug info for ~450 dependencies makes `target/` several GB; line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# `panic` is left at the default (unwind) on purpose: a panicking tunnel task must not take the whole
# resident app down with it.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
